[build-system]
requires = ["setuptools>=64", "pybind11>=2.12"]
build-backend = "setuptools.build_meta"

[project]
name = "winllm-suffix"
version = "0.1.0"
description = "Native (C++) suffix cache for wLLM SuffixDecoding — optional accelerator, wLLM falls back to pure Python without it"
requires-python = ">=3.10"
